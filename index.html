<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Narrador</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={theme:{extend:{colors:{ink:'#12161c',pan:'#1b212a',acc:'#d4a94f'},fontFamily:{serif:['Newsreader','Georgia','serif'],sans:['"Atkinson Hyperlegible"','system-ui','sans-serif']}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>textarea:focus,input:focus,button:focus-visible{outline:2px solid #d4a94f;outline-offset:1px}summary{list-style:none}summary::-webkit-details-marker{display:none}input[type=range]{accent-color:#d4a94f}</style>
</head>
<body class="bg-ink text-zinc-100 font-sans antialiased">
<header class="sticky top-0 z-20 bg-ink border-b border-white/10" style="padding-top:env(safe-area-inset-top)">
  <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
    <h1 class="font-serif font-bold text-2xl tracking-tight">Narrador</h1>
    <div id="lang" class="flex rounded-lg border border-white/10 overflow-hidden text-sm font-bold"></div>
  </div>
  <div id="st" class="max-w-xl mx-auto px-4 pb-2 text-sm text-zinc-400 min-h-[1.5rem] truncate"></div>
</header>
<main id="view" class="max-w-xl mx-auto px-4 pt-4 pb-28"></main>
<nav id="nav" class="fixed bottom-0 inset-x-0 z-20 bg-ink border-t border-white/10 grid grid-cols-3" style="padding-bottom:env(safe-area-inset-bottom)"></nav>
<div id="sheet" class="fixed inset-0 z-30 bg-ink overflow-y-auto hidden"></div>

<script>
const $=(s,e=document)=>e.querySelector(s), NARR='Narrador';
const HUES=['#d4a94f','#6fa8c9','#c97f9a','#7fae8c','#a58bd0','#d0906a','#6fc0b8','#b8b86a'];
const BASE={es:'Era una noche tranquila cuando ella cruzó el puente. «No tengas miedo», susurró, «yo estaré contigo».',fr:'La nuit était calme quand elle traversa le pont. « N’aie pas peur », murmura-t-elle, « je serai avec toi ».',en:'It was a quiet night when she crossed the bridge.'};
const LS={get(k,d){try{return JSON.parse(localStorage.getItem('nv3-'+k))??d}catch{return d}},set(k,v){try{localStorage.setItem('nv3-'+k,JSON.stringify(v))}catch{}}};
const S={lang:LS.get('lang','es'),tab:'text',map:LS.get('map',{}),mapn:LS.get('mapn',{}),want:{},text:LS.get('text',''),base:Object.assign({},BASE,LS.get('base',{})),q:'',sheet:null,playing:null,busy:false,stop:false,rate:LS.get('rate',1),from:0};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const say=(m,e)=>{const s=$('#st');s.textContent=m;s.className='max-w-xl mx-auto px-4 pb-2 text-sm min-h-[1.5rem] truncate '+(e?'text-red-400':'text-zinc-400')};

/* ---------- voces del dispositivo ---------- */
const VS=()=>{try{return speechSynthesis.getVoices()}catch{return[]}};
const vk=v=>v.voiceURI+'||'+v.lang;
const byKey=k=>VS().find(v=>vk(v)===k);
const fam=v=>{const c=v.lang.toLowerCase().replace('_','-').split('-')[0];return{spa:'es',fra:'fr',fre:'fr',eng:'en'}[c]||c};
const label=v=>{const c=v.lang.replace('_','-'),[a,b]=c.split('-');try{const L=new Intl.DisplayNames(['es'],{type:'language'}).of(a),R=b&&b.length===2?new Intl.DisplayNames(['es'],{type:'region'}).of(b.toUpperCase()):b;return L.charAt(0).toUpperCase()+L.slice(1)+(R?' · '+R:'')}catch{return c}};
const shown=()=>VS().filter(v=>(S.lang==='all'||fam(v)===S.lang)&&(!S.q||strip(v.name+' '+v.lang+' '+v.voiceURI).includes(strip(S.q))));
function res(w){
  let v=S.map[w]&&byKey(S.map[w]);if(v)return v;
  const n=S.want[w];
  if(n){v=VS().find(x=>strip(x.name).includes(strip(n))||strip(x.voiceURI).includes(strip(n)));if(v){S.map[w]=vk(v);S.mapn[w]=v.name;LS.set('map',S.map);LS.set('mapn',S.mapn);return v}}
  return null;
}
function speak(v,text,done){
  const u=new SpeechSynthesisUtterance(text);u.voice=v;u.lang=v.lang;u.rate=S.rate;u.onend=u.onerror=done;speechSynthesis.speak(u);
}
function stopAll(){try{speechSynthesis.cancel()}catch{}S.playing=null;mark()}
function test(k){
  if(S.playing===k){stopAll();return}
  stopAll();const v=byKey(k);if(!v){say('Esa voz ya no está disponible con el motor actual.',1);return}
  S.playing=k;mark();say('');
  setTimeout(()=>speak(v,S.base[fam(v)]||S.base.en,()=>{if(S.playing===k){S.playing=null;mark()}}),60);
}
const ico=k=>S.playing===k?'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>':'<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const mark=()=>document.querySelectorAll('[data-a=play]').forEach(b=>{b.innerHTML=ico(b.dataset.k);b.className='shrink-0 w-12 h-12 rounded-full grid place-items-center '+(S.playing===b.dataset.k?'bg-acc text-ink':'bg-white/10 text-zinc-100')});

/* ---------- texto ---------- */
const nm=n=>/^narrad(or|eur)$/i.test(n.trim())?NARR:n.trim();
function parse(raw){
  const segs=[],re=/\[([^\[\]:]{1,40}):\s*([^\[\]]+)\]/g;
  for(const line of raw.split(/\r?\n/)){
    const t=line.trim();if(!t||/^@voz/i.test(t))continue;
    if(/^##\s+/.test(t)){segs.push({w:NARR,t:t.replace(/^##\s+/,'').replace(/[.:!?]*$/,'.'),h:1},{p:1300});continue}
    let last=0,x;re.lastIndex=0;
    while((x=re.exec(t))){const a=t.slice(last,x.index).trim();if(a)segs.push({w:NARR,t:a});segs.push({w:nm(x[1]),t:x[2].trim()});last=re.lastIndex}
    const b=t.slice(last).trim();if(b)segs.push({w:NARR,t:b});segs.push({p:450});
  }
  return segs;
}
const names=()=>[NARR,...new Set(parse(S.text).filter(s=>s.w&&s.w!==NARR).map(s=>s.w))];
function directives(){for(const l of S.text.split(/\r?\n/)){const m=l.trim().match(/^@voz\s+(.+?)\s*=\s*(.+)$/i);if(m)S.want[nm(m[1])]=m[2].trim()}}
function pieces(text,max=280){
  const ss=text.match(/[^.!?…]+[.!?…]+["»”)]*\s*|[^.!?…]+$/g)||[text],out=[];let cur='';
  for(const s of ss){if((cur+s).length>max&&cur){out.push(cur);cur=''}cur+=s}
  if(cur.trim())out.push(cur);return out;
}

/* ---------- vistas ---------- */
const row=(v,pick)=>`<div class="flex items-center gap-3 py-3 border-b border-white/5 last:border-0">
 <button data-a="play" data-k="${esc(vk(v))}" aria-label="Probar ${esc(v.name)}" class="shrink-0 w-12 h-12 rounded-full grid place-items-center bg-white/10 text-zinc-100">${ico(vk(v))}</button>
 <div class="flex-1 min-w-0"><div class="font-bold truncate">${esc(v.name)}</div>
 <div class="text-xs text-zinc-400 truncate">${esc(v.lang)} · ${v.localService?'sin internet':'necesita internet'}${v.default?' · predeterminada':''}</div>
 <div class="text-[11px] text-zinc-500 truncate">${esc(v.voiceURI)}</div></div>
 ${pick?`<button data-a="use" data-k="${esc(vk(v))}" class="shrink-0 px-4 h-10 rounded-lg bg-acc text-ink font-bold text-sm">Usar</button>`:''}</div>`;
function vrows(pick){
  if(!VS().length)return '<p class="text-sm text-zinc-400">No se detecta ninguna voz. Revisa Paramètres › Synthèse vocale, vuelve aquí y toca «Actualizar lista».</p>';
  const vs=shown();if(!vs.length)return '<p class="text-sm text-zinc-400">Ninguna voz coincide con el filtro.</p>';
  const g={};vs.forEach(v=>(g[label(v)]=g[label(v)]||[]).push(v));
  return Object.keys(g).sort().map(k=>`<div class="mb-4 rounded-xl border border-white/10 bg-pan overflow-hidden"><div class="px-4 py-3 border-b border-white/10 font-serif font-bold text-lg">${esc(k)} <span class="font-sans text-xs text-acc">${g[k].length}</span></div><div class="px-4">${g[k].map(v=>row(v,pick)).join('')}</div></div>`).join('');
}
function vlist(pick){
  const bl=S.lang==='all'?'es':S.lang;
  return `<div class="rounded-xl bg-pan border border-white/10 p-4 mb-4"><div class="font-serif font-bold text-lg">${VS().length} voces ahora mismo</div>
  <div class="text-sm text-zinc-400 mt-1">Son exactamente las que da el motor de voz activo de tu teléfono (Samsung o Google). Para ver las del otro motor, cámbialo en Paramètres › Synthèse vocale, vuelve aquí y toca Actualizar.</div>
  <button data-a="refresh" class="mt-3 w-full h-11 rounded-lg bg-acc text-ink font-bold">Actualizar lista</button></div>
  <input class="qin w-full h-11 rounded-lg bg-pan border border-white/10 px-3 mb-3" placeholder="Buscar voz por nombre" value="${esc(S.q)}">
  <label class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-1">Texto de prueba</label>
  <textarea class="basein w-full h-24 rounded-xl bg-pan border border-white/10 p-3 text-[15px] resize-none">${esc(S.base[bl])}</textarea>
  <p class="text-xs text-zinc-500 mt-1 mb-4">Toca ▶ en cualquier voz para oírla. Las voces de otros idiomas leen una frase corta de ejemplo.</p>
  <div class="vl" data-pick="${pick?1:0}">${vrows(pick)}</div>`;
}
const vname=w=>{const v=res(w);return v?esc(v.name):''};
const castHtml=()=>names().map((w,i)=>{const v=res(w),sv=S.mapn[w]||S.want[w];
  return `<div class="flex rounded-xl bg-pan border border-white/10 overflow-hidden"><i class="w-1.5 shrink-0" style="background:${HUES[i%8]}"></i>
  <div class="flex-1 min-w-0 p-3"><div class="font-serif font-bold text-lg">${esc(w)}${w===NARR?' <span class="text-xs font-sans font-normal text-zinc-400">cuenta todo lo demás</span>':''}</div>
  <div class="text-sm truncate ${v?'text-zinc-300':'text-acc'}">${v?esc(v.name)+' · '+esc(v.lang):sv?'No disponible con el motor actual: '+esc(sv):'Sin voz asignada'}</div></div>
  <button data-a="pick" data-w="${esc(w)}" class="px-4 font-bold text-acc">${v?'Cambiar':'Elegir'}</button></div>`}).join('<div class="h-2"></div>');
function chapters(){const out=[];parse(S.text).forEach((s,i)=>{if(s.h)out.push({i,t:s.t.replace(/\.$/,'')})});return out}
const view={
 text:()=>`<textarea id="txt" class="w-full h-64 rounded-xl bg-pan border border-white/10 p-3 text-[15px] resize-y" placeholder="Pega aquí los capítulos ya marcados, varios a la vez.">${esc(S.text)}</textarea>
  <div class="grid grid-cols-2 gap-2 mt-2"><label class="h-11 grid place-items-center rounded-lg border border-white/10 font-bold cursor-pointer">Cargar .txt<input id="file" type="file" accept=".txt,text/plain" hidden></label>
  <button data-a="clear" class="h-11 rounded-lg border border-white/10 font-bold">Borrar</button></div>
  <details class="mt-3 rounded-xl border border-white/10 p-3 text-sm text-zinc-400"><summary class="font-bold text-zinc-100 cursor-pointer">Formato del texto</summary>
  <pre class="mt-2 whitespace-pre-wrap text-xs text-zinc-300">## Capítulo 12: El puente
Narración normal.
[Luna: Ven conmigo.] dijo ella.
@voz Luna = Jorge
@voz Narrador = Mónica</pre><p class="mt-2">Lo que va entre corchetes con «Nombre:» lo dice ese personaje. Lo demás, el narrador. Las líneas @voz buscan la voz por parte del nombre entre las que tienes ahora.</p></details>
  <h2 class="font-serif font-bold text-xl mt-6 mb-2">Reparto</h2><div id="cast">${castHtml()}</div>`,
 voices:()=>vlist(false),
 read:()=>{const c=parse(S.text).filter(s=>s.t).reduce((a,s)=>a+s.t.length,0),n=names().length-1,ch=chapters();
  return `<div class="rounded-xl bg-pan border border-white/10 p-4"><div class="font-serif font-bold text-xl">${c.toLocaleString('es')} caracteres</div>
  <div class="text-sm text-zinc-400">1 narrador y ${n} personaje${n===1?'':'s'}. Las voces del dispositivo se escuchan en vivo; no se guardan en archivo.</div></div>
  ${ch.length?`<label class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mt-4 mb-1">Empezar desde</label><select id="from" class="w-full h-11 rounded-lg bg-pan border border-white/10 px-3"><option value="0">El principio</option>${ch.map(x=>`<option value="${x.i}" ${S.from===x.i?'selected':''}>${esc(x.t)}</option>`).join('')}</select>`:''}
  <label class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mt-4 mb-1">Velocidad <span id="rv" class="text-acc">${S.rate.toFixed(2)}×</span></label>
  <input id="rate" type="range" min="0.6" max="1.6" step="0.05" value="${S.rate}" class="w-full">
  <div class="grid grid-cols-3 gap-2 mt-4"><button data-a="listen" ${S.busy?'disabled':''} class="col-span-2 h-12 rounded-lg bg-acc text-ink font-bold disabled:opacity-40">Escuchar ahora</button>
  <button data-a="cancel" ${S.busy?'':'disabled'} class="h-12 rounded-lg border border-white/10 font-bold disabled:opacity-40">Detener</button></div>
  <div class="h-2.5 rounded-full bg-pan border border-white/10 mt-4 overflow-hidden"><i id="bar" class="block h-full bg-emerald-500" style="width:0%"></i></div>
  <p class="text-xs text-zinc-500 mt-3">Mantén la pantalla encendida mientras escuchas: en Android, Chrome suele cortar la voz si se bloquea el teléfono.</p>`}
};
const TABS=[['text','Texto','M5 4h14v2H5zm0 5h14v2H5zm0 5h9v2H5z'],['voices','Voces','M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zm-6 9a6 6 0 0 0 12 0h-2a4 4 0 0 1-8 0zm5 7v2h2v-2z'],['read','Escuchar','M8 5v14l11-7z']];
function render(){
  $('#lang').innerHTML=[['es','Español'],['fr','Français'],['all','Todas']].map(([l,t])=>`<button data-a="lang" data-l="${l}" class="px-3 py-2 ${S.lang===l?'bg-acc text-ink':'text-zinc-300'}">${t}</button>`).join('');
  $('#nav').innerHTML=TABS.map(([id,t,d])=>`<button data-a="tab" data-t="${id}" class="py-3 flex flex-col items-center gap-1 text-xs font-bold ${S.tab===id?'text-acc':'text-zinc-400'}"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="${d}"/></svg>${t}</button>`).join('');
  $('#view').innerHTML=view[S.tab]();
  const sh=$('#sheet');sh.classList.toggle('hidden',!S.sheet);
  if(S.sheet)sh.innerHTML=`<div class="sticky top-0 bg-ink border-b border-white/10 px-4 py-3 flex items-center justify-between" style="padding-top:calc(env(safe-area-inset-top) + .75rem)"><div class="font-serif font-bold text-xl">Voz para ${esc(S.sheet)}</div><button data-a="close" class="font-bold text-acc">Cerrar</button></div><div class="max-w-xl mx-auto p-4">${vlist(true)}</div>`;
}
const soft=()=>{if(S.tab==='voices'||S.sheet)render();else{const c=$('#cast');if(c)c.innerHTML=castHtml()}};

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='play')test(b.dataset.k);
  else if(a==='tab'){stopAll();S.tab=b.dataset.t;render();scrollTo(0,0)}
  else if(a==='lang'){stopAll();S.lang=b.dataset.l;LS.set('lang',S.lang);render()}
  else if(a==='pick'){S.sheet=b.dataset.w;render()}
  else if(a==='close'){stopAll();S.sheet=null;render()}
  else if(a==='use'){const v=byKey(b.dataset.k);S.map[S.sheet]=b.dataset.k;S.mapn[S.sheet]=v?v.name:'';LS.set('map',S.map);LS.set('mapn',S.mapn);stopAll();S.sheet=null;render()}
  else if(a==='clear'){S.text='';LS.set('text','');render()}
  else if(a==='refresh'){stopAll();render();say(VS().length+' voces detectadas.')}
  else if(a==='listen')listen();
  else if(a==='cancel'){S.stop=true;stopAll()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='txt'){S.text=t.value;LS.set('text',S.text);directives();$('#cast').innerHTML=castHtml()}
  else if(t.classList.contains('basein')){S.base[S.lang==='all'?'es':S.lang]=t.value;LS.set('base',S.base)}
  else if(t.classList.contains('qin')){S.q=t.value;document.querySelectorAll('.vl').forEach(el=>el.innerHTML=vrows(el.dataset.pick==='1'))}
  else if(t.id==='rate'){S.rate=+t.value;LS.set('rate',S.rate);$('#rv').textContent=S.rate.toFixed(2)+'×'}
});
document.addEventListener('change',async e=>{
  if(e.target.id==='file'){const f=e.target.files[0];if(f){S.text=await f.text();LS.set('text',S.text);directives();render()}}
  else if(e.target.id==='from')S.from=+e.target.value;
});

/* ---------- lectura en vivo ---------- */
async function listen(){
  const segs=parse(S.text),who=names();
  if(!segs.some(s=>s.t)){say('Pega primero el texto.',1);return}
  const miss=who.filter(w=>!res(w));if(miss.length){say('Falta una voz disponible para: '+miss.join(', '),1);return}
  const vo={};who.forEach(w=>vo[w]=res(w));
  S.busy=true;S.stop=false;stopAll();render();
  let wl;try{wl=await navigator.wakeLock.request('screen')}catch{}
  try{
    const jobs=[];segs.slice(S.from<segs.length?S.from:0).forEach(s=>s.p?jobs.push(s):pieces(s.t).forEach(t=>jobs.push({w:s.w,t})));
    const tot=jobs.filter(j=>j.t).length;let n=0;
    for(const j of jobs){
      if(S.stop)break;
      if(j.p){await new Promise(r=>setTimeout(r,j.p/S.rate));continue}
      say(`Leyendo ${++n} de ${tot} · ${j.w}`);const bar=$('#bar');if(bar)bar.style.width=Math.round(n*100/tot)+'%';
      await new Promise(r=>speak(vo[j.w],j.t,r));
    }
    say(S.stop?'Detenido.':'Fin de la lectura.');
  }finally{S.busy=false;if(wl)wl.release().catch(()=>{});render()}
}

/* ---------- arranque ---------- */
directives();render();
try{speechSynthesis.onvoiceschanged=soft}catch{}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)soft()});
addEventListener('focus',soft);
let tries=0;const poll=setInterval(()=>{if(VS().length||++tries>20){clearInterval(poll);soft()}},300);
</script>
</body>
</html>
